<!doctype html>
<html>
  <head>
    <title>Bookshop</title>
    <link rel="stylesheet" href="partials/shared.css" />
    <link rel="stylesheet" href="book.css" />
    <meta charset="UTF-8">
  </head>
  <body>
    <div id="site-header"></div>

    <div class="book-wrapper">
      <img id="image" class="image" />
      <div class="book-info-and-buy">
        <div class="book-info">
          <div id="title" class="title"></div>
          <button id="author" class="author"></button>
          <div id="description" class="description"></div>
          <div id="price" class="price"></div>
        </div>
        <button class="buy-button" onclick="onBuyButtonClicked()">Buy</button>
      </div>
    </div>
    <div id="buyAlert" class="buy-alert">The item was added to your cart</div>

    <script src="partials/header/header.js"></script>
    <script src="book.js"></script>
  </body>
</html>
