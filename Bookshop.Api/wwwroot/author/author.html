<!doctype html>
<html>
  <head>

    <link rel="stylesheet" href="../partials/shared.css" />
    <link rel="stylesheet" href="author.css" />
    <meta charset="UTF-8">
  </head>
  <body>
    <div id="site-header"></div>

    <div id="authorOverview" class="author-overview">
      <img id="authorImage" class="author-image" />
      <div class="author-text-overview">
        <div id="authorName" class="author-name"></div>
        <div id="authorBornDead" class="author-born-dead">
          <span id="authorBorn" class="author-born"></span>
          <span> - </span>
          <span id="authorDead" class="author-dead"></span>
        </div>
        <div id="authorBiography" class="author-biography"></div>
      </div>
    </div>

    <div id="authorBooksNumber" class="author-books-number"></div>
    <div id="authorBooksWrapper" class="author-books-wrapper"></div>

    <script src="../partials/header/header.js"></script>
    <script src="author.js"></script>
  </body>
</html>
