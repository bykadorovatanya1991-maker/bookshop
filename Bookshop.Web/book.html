<!doctype html>
<html>
  <head>
    <title>Bookshop</title>
    <link rel="stylesheet" href="book.css" />
    <link rel="stylesheet" href="cart-button.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="back-cart-wrapper">
      <button class="back-button" onclick="onBackButtonClicked()">Back</button>
      <button onclick="onCartButtonClicked()" class="cart-button">
        <img class="cart-image" src="images/icons/cart-icon.jpg" />
        <span id="itemsInTheCart" class="items-in-the-cart"></span>
      </button>
    </div>
    <div class="book-wrapper">
      <img id="image" class="image" />
      <div class="book-info-and-buy">
        <div class="book-info">
          <div id="title" class="title"></div>
          <button id="author" class="author"></button>
          <div id="description" class="description"></div>
          <div id="price" class="price"></div>
        </div>
        <button class="buy-button" onclick="onBuyButtonClicked()">Buy</button>
      </div>
    </div>
    <div id="buyAlert" class="buy-alert">The item was added to your cart</div>

    <script src="book.js"></script>
    <script src="cart-button.js"></script>
  </body>
</html>
