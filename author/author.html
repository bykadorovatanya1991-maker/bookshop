<!doctype html>
<html>
  <head>
    <title>Bookshop</title>
    <link rel="stylesheet" href="author.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="authorOverview" class="author-overview">
      <img id="authorImage" class="author-image" />
      <div id="AuthorTextOverview" class="author-text-overview">
        <div id="authorDescription" class="author-description"></div>
        <div id="authorBooksNumber" class="author-books-number"></div>
      </div>
    </div>

    <div class="book-wrapper">
      <img id="image" />
      <div class="book-info">
        <div id="title"></div>
        <div id="author"></div>
        <div id="description"></div>
      </div>
    </div>

    <script src="author.js"></script>
  </body>
</html>
